services:
  # ============================================================================
  # 1. POSTGRESQL 16 (Primary Clinical Database - Pillars 5, 8)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: tspi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-drpatrcl_sys}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026_clinic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-drpatrcl_sys}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tspi_internal

  # ============================================================================
  # 2. REDIS 7 (Cache, Sessions & Rate Limiting - Pillars 1, 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: tspi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - tspi_internal

  # ============================================================================
  # 3. TSPI MONOLITH WEB APP (Django + Gunicorn + WeasyPrint)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tspi_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8088
      PRIVATE_MEDIA_ROOT: /app/private_media
      GUNICORN_WORKERS: 3
      GUNICORN_THREADS: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - private_media:/app/private_media
    networks:
      - tspi_internal

  # ============================================================================
  # 3b. AI SERVICE (FastAPI) — internal only, no published ports.
  #     Every route except /health requires X-Internal-Token (INTERNAL_API_TOKEN in .env)
  # ============================================================================
  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tspi_ai
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["uvicorn", "ai_service.main:app", "--host", "0.0.0.0", "--port", "8088", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tspi_internal

  # ============================================================================
  # 4. NGINX REVERSE PROXY (SSL, Rate Limiting, Static & SSE Streaming)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: tspi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - tspi_internal

networks:
  tspi_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  private_media:
    driver: local
