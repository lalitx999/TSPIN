services:
  # ============================================================================
  # 1. POSTGRESQL 16 (Primary Clinical Database - Pillars 5, 8)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: tspi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-drpatrcl_sys}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026_clinic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-drpatrcl_sys}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tspi_internal

  # ============================================================================
  # 2. REDIS 7 (Cache, Sessions & Rate Limiting - Pillars 1, 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: tspi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - tspi_internal

  # ============================================================================
  # 3. TSPI MONOLITH WEB APP (Django + Gunicorn + WeasyPrint)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tspi_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SSLMODE: disable
      AI_SERVICE_URL: http://ai:8088
      PRIVATE_MEDIA_ROOT: /app/private_media
      GUNICORN_WORKERS: 3
      GUNICORN_THREADS: 8
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - private_media:/app/private_media
    networks:
      - tspi_internal

  # ============================================================================
  # 3b. AI SERVICE (FastAPI) — internal only, no published ports.
  #     Every route except /health requires X-Internal-Token (INTERNAL_API_TOKEN in .env)
  # ============================================================================
  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tspi_ai
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["uvicorn", "ai_service.main:app", "--host", "0.0.0.0", "--port", "8088", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tspi_internal

  # ============================================================================
  # 4. NGINX REVERSE PROXY (HTTPS via Let's Encrypt, SSE streaming)
  #    First-time certificate: scripts/init_tls.sh (see docs/DEPLOY_VPS.md)
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: tspi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. emr.example.com)}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - static_volume:/app/staticfiles:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # conf.d เป็น tmpfs เพื่อไม่ให้ default.conf ของ image (หน้า Welcome) ถูกโหลด
    tmpfs:
      - /etc/nginx/conf.d
    # reload ทุก 6 ชม. เพื่อใช้ใบรับรองที่ certbot ต่ออายุแล้ว
    # ต้องเรียกผ่าน /docker-entrypoint.sh ไม่งั้น image จะไม่สร้าง conf จาก templates (nginx ไม่ฟังพอร์ตใดเลย)
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'
    depends_on:
      - web
    networks:
      - tspi_internal

  # ============================================================================
  # 5. CERTBOT (Let's Encrypt renewal loop, every 12h)
  # ============================================================================
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: tspi_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  tspi_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  private_media:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local
