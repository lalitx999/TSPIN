{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TSPI CLINIC - ระบบเวชระเบียนและความฉลาดทางการแพทย์ 39 แกนชีววิทยา (12 โดเมน){% endblock %}</title>
    
    <!-- Google Fonts: Kanit (Clean & Readable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#689D4B',
                            light: '#82b366',
                            dark: '#528238',
                            50: '#f4f8f1',
                            100: '#e6f0e0',
                            200: '#cfe3c4',
                            500: '#689D4B',
                            600: '#528238',
                            700: '#3e632a',
                        },
                        secondary: {
                            DEFAULT: '#F2F2F2',
                            light: '#FAFAFA',
                            dark: '#E5E5E5',
                        },
                        surface: '#FFFFFF',
                    },
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                        sans: ['Kanit', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025)',
                        'card': '0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <!-- Global Styling: Soft Medical Clean (Primary: #689D4B, Secondary: #F2F2F2, Black Font Kanit) -->
    <style>
        :root {
            --primary: #689D4B;
            --primary-dark: #528238;
            --primary-light: #82b366;
            --secondary: #F2F2F2;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            font-weight: 400;
            background-color: #F8FAF6;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Kanit', sans-serif;
            font-weight: 500;
            color: #111827;
            letter-spacing: -0.01em;
        }

        /* Modern Tailwind 2026 Form Controls (Overrides outdated Bootstrap form-control) */
        .form-control, input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
            width: 100%;
            border-radius: 0.75rem !important; /* rounded-xl */
            border: 1px solid #E5E7EB !important; /* border-gray-200 */
            background-color: #FFFFFF !important;
            padding: 0.625rem 0.875rem !important;
            font-size: 0.875rem !important;
            line-height: 1.25rem !important;
            color: #111827 !important;
            font-family: 'Kanit', sans-serif !important;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02) !important;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        .form-control:focus, input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #689D4B !important;
            box-shadow: 0 0 0 3px rgba(104, 157, 75, 0.18) !important;
        }
        .form-control::placeholder, input::placeholder, textarea::placeholder {
            color: #9CA3AF !important;
            font-weight: 300 !important;
        }

        /* Custom Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F2F2F2;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }
    </style>

    <!-- FontAwesome Free Icons (Local Vendor) -->
    <link rel="stylesheet" href="{% static 'vendor/adminlte/plugins/fontawesome-free/css/all.min.css' %}">
    
    <!-- HTMX 2.0.4 & Alpine.js 3.14 -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

    <!-- CSRF Token Integration for HTMX -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.body.addEventListener('htmx:configRequest', function (evt) {
                const csrfToken = '{{ csrf_token }}';
                if (csrfToken) {
                    evt.detail.headers['X-CSRFToken'] = csrfToken;
                }
            });
        });
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#F2F2F2] text-[#111827] font-kanit {% block body_class %}{% endblock %}">
    {% block layout %}{% block content %}{% endblock %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
