{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TSPI CLINIC — ระบบเวชระเบียนและความฉลาดทางการแพทย์ 39 แกนชีววิทยา (12 โดเมน){% endblock %}</title>

    <!-- Bootstrap 5.3.8 CSS (Local Static — No CDN / No npm) -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">

    <!-- FontAwesome Free Icons (Local Static) -->
    <link rel="stylesheet" href="{% static 'vendor/adminlte/plugins/fontawesome-free/css/all.min.css' %}">

    <!-- HTMX 2.0.4 & Alpine.js 3.14 -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

    <!-- Global Styling: Soft Medical Clean (Primary: #689D4B, Secondary: #F8F9FA, Font: THSarabunNew) -->
    <style>
        @font-face {
            font-family: 'THSarabunNew';
            src: url("{% static 'fonts/THSarabunNew.ttf' %}") format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'THSarabunNew';
            src: url("{% static 'fonts/THSarabunNew Bold.ttf' %}") format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'THSarabunNew';
            src: url("{% static 'fonts/THSarabunNew Italic.ttf' %}") format('truetype');
            font-weight: 400;
            font-style: italic;
        }
        @font-face {
            font-family: 'THSarabunNew';
            src: url("{% static 'fonts/THSarabunNew BoldItalic.ttf' %}") format('truetype');
            font-weight: 700;
            font-style: italic;
        }

        :root {
            --bs-primary: #2E7D32;
            --bs-primary-rgb: 46, 125, 50;
            --bs-primary-dark: #1B5E20;
            --bs-primary-light: #4CAF50;
            --bs-body-font-family: 'THSarabunNew', 'Sarabun', sans-serif;
            --bs-body-bg: #EEF2F6;
            --bs-body-color: #0F172A;
            --bs-border-radius: 0.85rem;
            --bs-border-radius-lg: 1.25rem;
            --bs-border-radius-xl: 1.5rem;
        }

        html {
            font-size: 19px; /* Enhanced sharpness and legibility for TH Sarabun New */
        }

        body {
            font-family: 'THSarabunNew', 'Sarabun', sans-serif;
            font-weight: 500; /* Medium weight gives solid, readable strokes on high-DPI screens */
            font-size: 1.05rem;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.45;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'THSarabunNew', 'Sarabun', sans-serif;
            font-weight: 700;
            color: #0F172A;
            line-height: 1.25;
        }

        /* Stronger Readability for Subtext */
        .text-muted {
            color: #475569 !important; /* High contrast slate-600 instead of washed-out gray */
            font-weight: 500;
        }

        /* Buttons */
        .btn {
            font-family: 'THSarabunNew', 'Sarabun', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 0.65rem;
        }

        .btn-primary {
            --bs-btn-bg: #2E7D32;
            --bs-btn-border-color: #2E7D32;
            --bs-btn-hover-bg: #1B5E20;
            --bs-btn-hover-border-color: #1B5E20;
            --bs-btn-active-bg: #144618;
            --bs-btn-active-border-color: #144618;
            --bs-btn-focus-shadow-rgb: 46, 125, 50;
            padding: 0.45rem 1.25rem;
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.2);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
        }

        .btn-outline-primary {
            --bs-btn-color: #2E7D32;
            --bs-btn-border-color: #2E7D32;
            --bs-btn-hover-bg: #2E7D32;
            --bs-btn-hover-border-color: #2E7D32;
            padding: 0.45rem 1.25rem;
            transition: all 0.2s ease;
        }

        /* Cards with High Contrast */
        .card {
            border-radius: 0.85rem;
            border: 1px solid #CBD5E1;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
            background-color: #FFFFFF;
        }

        /* Form Controls */
        .form-control, .form-select {
            border-radius: 0.65rem;
            border: 1px solid #94A3B8;
            padding: 0.5rem 0.85rem;
            font-size: 1.05rem;
            font-weight: 500;
            font-family: 'THSarabunNew', 'Sarabun', sans-serif;
            color: #0F172A;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2E7D32;
            box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.2);
        }

        /* Badges */
        .badge {
            font-family: 'THSarabunNew', 'Sarabun', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.35em 0.7em;
        }

        .badge-primary-soft {
            background-color: rgba(46, 125, 50, 0.12);
            color: #1B5E20;
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        /* Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
    </style>

    <!-- CSRF Token Integration for HTMX -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.body.addEventListener('htmx:configRequest', function (evt) {
                const csrfToken = '{{ csrf_token }}';
                if (csrfToken) {
                    evt.detail.headers['X-CSRFToken'] = csrfToken;
                }
            });
        });
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block layout %}{% block content %}{% endblock %}{% endblock %}

    <!-- Bootstrap 5.3.8 JS Bundle (Local Static) -->
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
