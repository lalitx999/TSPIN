{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TSPI CLINIC - ระบบเวชระเบียนและความฉลาดทางการแพทย์ 38 แกนชีววิทยา{% endblock %}</title>
    
    <!-- Google Fonts: Kanit (Clean & Readable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#689D4B',
                            light: '#82b366',
                            dark: '#528238',
                            50: '#f4f8f1',
                            100: '#e6f0e0',
                            200: '#cfe3c4',
                            500: '#689D4B',
                            600: '#528238',
                            700: '#3e632a',
                        },
                        secondary: {
                            DEFAULT: '#F2F2F2',
                            light: '#FAFAFA',
                            dark: '#E5E5E5',
                        },
                        surface: '#FFFFFF',
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                        }
                    },
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                        sans: ['Kanit', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Global Styling: Soft Medical Clean (Primary: #689D4B, Secondary: #F2F2F2, Black Font Kanit) -->
    <style>
        :root {
            --primary: #689D4B;
            --primary-dark: #528238;
            --primary-light: #82b366;
            --secondary: #F2F2F2;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            font-weight: 400;
            background-color: #F2F2F2;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Kanit', sans-serif;
            font-weight: 500;
            color: #111827;
        }
    </style>

    <!-- FontAwesome Free Icons (Local Vendor) -->
    <link rel="stylesheet" href="{% static 'vendor/adminlte/plugins/fontawesome-free/css/all.min.css' %}">
    
    <!-- HTMX 2.0.4 & Alpine.js 3.14 -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

    <!-- CSRF Token Integration for HTMX -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.body.addEventListener('htmx:configRequest', function (evt) {
                const csrfToken = '{{ csrf_token }}';
                if (csrfToken) {
                    evt.detail.headers['X-CSRFToken'] = csrfToken;
                }
            });
        });
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#F2F2F2] text-[#111827] font-kanit {% block body_class %}{% endblock %}">
    {% block layout %}{% block content %}{% endblock %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
